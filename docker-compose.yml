services:
  # Сервис 1: Ollama (LLM Engine)
  ollama:
    image: ollama/ollama:latest
    container_name: tg-assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      # Монтируем папку для хранения моделей, чтобы они не пропадали при рестарте
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h  # Держим модель в памяти дольше
    restart: unless-stopped
    # Раскомментируй ниже, если хочешь использовать NVIDIA GPU на Linux/WSL2
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Сервис 2: Telegram Bot (Application Logic)
  bot:
    build: .
    container_name: tg-assistant-bot
    depends_on:
      - ollama
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OLLAMA_BASE_URL=http://ollama:11434/v1  
      - OLLAMA_MODEL=qwen2.5:7b-instruct
      - TOOL_MODE=native
      - MAX_AGENT_STEPS=4
      - HISTORY_LIMIT=20
      - DB_PATH=/data/assistant.db              
      - LOG_LEVEL=INFO
      - DEFAULT_TIMEZONE=Europe/Moscow
    volumes:
      # Монтируем отдельную папку для базы данных SQLite, чтобы она сохранялась
      - ./bot_data:/data
    restart: unless-stopped
    network_mode: bridge # Или default, если сеть создается автоматически compose